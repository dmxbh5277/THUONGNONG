<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tra cứu Giá Thưởng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-2: #f1f3f7;
    --border: #e4e7ee;
    --text: #1b1f2a;
    --muted: #6b7280;
    --accent: #ea7f2b;      /* warm amber-orange, works well on light bg */
    --accent-soft: #fdf1e4;
    --accent-border: #f6d9b8;
    --green: #1f9d55;
    --red: #d64545;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 16px rgba(20,22,30,.05);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Roboto', system-ui, sans-serif;
    min-height:100vh;
    padding:16px 12px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:820px; margin:0 auto; }

  /* Header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:18px; flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'Roboto Mono', monospace;
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin:0 0 4px; font-weight:600;
  }
  h1{
    font-size:clamp(20px,5vw,26px); font-weight:700; margin:0;
    letter-spacing:-0.01em;
  }
  .sync{
    display:flex; align-items:center; gap:7px;
    font-family:'Roboto Mono', monospace; font-size:11px; color:var(--muted);
    padding:6px 10px; border:1px solid var(--border); border-radius:100px;
    background:var(--panel); box-shadow:var(--shadow);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(31,157,85,.15); flex-shrink:0; }
  .dot.loading{ background:var(--accent); box-shadow:0 0 0 3px rgba(234,127,43,.16); animation:pulse 1.1s ease-in-out infinite; }
  .dot.err{ background:var(--red); box-shadow:0 0 0 3px rgba(214,69,69,.16); }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  /* Controls */
  .controls{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;
  }
  @media (max-width:560px){ .controls{ grid-template-columns:1fr; } }

  .field{ position:relative; }
  .field label{
    display:block; font-size:11px; font-family:'Roboto Mono',monospace;
    letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; font-weight:600;
  }
  .field input{
    width:100%; background:var(--panel); border:1px solid var(--border);
    color:var(--text); border-radius:12px; padding:13px 14px; font-size:15px;
    font-family:'Roboto',sans-serif; outline:none; transition:border-color .15s, box-shadow .15s;
    box-shadow:var(--shadow);
  }
  .field input::placeholder{ color:#a4a9b6; }
  .field input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(234,127,43,.14); }

  .input-with-clear{ position:relative; }
  .input-with-clear input{ padding-right:40px; }
  .clear-btn{
    position:absolute; top:50%; right:6px; transform:translateY(-50%);
    width:28px; height:28px; border-radius:50%; border:none; background:var(--panel-2);
    color:var(--muted); font-size:14px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .12s, color .12s;
  }
  .clear-btn:hover{ background:var(--accent-soft); color:var(--accent); }

  .hint{
    background:var(--panel); border:1px dashed var(--border); border-radius:12px;
    padding:16px; text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:6px;
  }

  .suggest{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    max-height:280px; overflow-y:auto; z-index:20;
    box-shadow:0 12px 28px rgba(20,22,30,.14); display:none;
  }
  .suggest.open{ display:block; }
  .suggest .opt{
    padding:12px 14px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; gap:10px; align-items:center;
  }
  .suggest .opt:last-child{ border-bottom:none; }
  .suggest .opt:hover, .suggest .opt.active{ background:var(--accent-soft); }
  .suggest .opt .name{ color:var(--text); font-weight:500; }
  .suggest .opt .grp{ font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .suggest .empty{ padding:14px; color:var(--muted); font-size:13px; text-align:center; }

  /* Section label */
  .section-label{
    display:flex; align-items:center; justify-content:space-between;
    margin:22px 0 10px;
  }
  .section-label h2{
    font-size:13px; font-family:'Roboto Mono',monospace; letter-spacing:.06em;
    text-transform:uppercase; color:var(--muted); margin:0; font-weight:600;
  }
  .count{ font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--muted); }

  /* Top bonus grid */
  .top-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  @media (min-width:640px){ .top-grid{ grid-template-columns:repeat(4,1fr); } }
  .top-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:14px; box-shadow:var(--shadow); cursor:pointer; position:relative;
    transition:transform .12s, box-shadow .12s;
  }
  .top-card:active{ transform:scale(.98); }
  .top-rank{
    position:absolute; top:10px; right:12px;
    font-family:'Roboto Mono',monospace; font-size:11px; font-weight:700; color:var(--accent-border);
  }
  .top-rank.r1{ color:var(--accent); }
  .top-name{
    font-size:13px; font-weight:600; line-height:1.35; margin:2px 26px 12px 0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:2.7em;
  }
  .top-bonus-label{ font-size:10px; color:var(--muted); font-family:'Roboto Mono',monospace; letter-spacing:.05em; text-transform:uppercase; }
  .top-bonus-val{ font-family:'Roboto Mono',monospace; font-size:18px; font-weight:700; color:var(--accent); margin-top:2px; }
  .top-empty{ grid-column:1/-1; padding:24px; text-align:center; color:var(--muted); font-size:13px; background:var(--panel); border:1px solid var(--border); border-radius:14px; }

  /* Results list (card rows, mobile-first) */
  .tablewrap{
    border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--panel);
    box-shadow:var(--shadow);
  }
  .scrollbody{ max-height:560px; overflow-y:auto; }

  .rowhead{
    display:flex; padding:10px 14px; background:var(--panel-2); border-bottom:1px solid var(--border);
    font-family:'Roboto Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); font-weight:600; position:sticky; top:0; z-index:1;
  }
  .rowhead .c-name{ flex:1; }
  .rowhead .c-num{ width:78px; text-align:right; }

  .prow{
    display:flex; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border);
    cursor:pointer; transition:background .1s;
  }
  .prow:last-child{ border-bottom:none; }
  .prow:hover, .prow:active{ background:var(--accent-soft); }
  .prow .c-name{ flex:1; min-width:0; padding-right:8px; }
  .prow .c-name .nm{ font-size:13.5px; font-weight:500; line-height:1.35; }
  .prow .c-num{ width:78px; text-align:right; font-family:'Roboto Mono',monospace; font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--text); }
  .prow .c-num.bonus{ color:var(--accent); font-weight:700; font-size:13px; }

  .empty-state{ padding:36px 20px; text-align:center; color:var(--muted); font-size:13.5px; }
  .empty-state b{ color:var(--text); }
  .loading-state{ padding:36px 20px; text-align:center; color:var(--muted); font-family:'Roboto Mono',monospace; font-size:12.5px; }
  .error-state{ padding:18px; color:var(--red); font-size:13px; line-height:1.5; }

  .copyable{ cursor:pointer; }
  .copyable:hover{ color:var(--accent); text-decoration:underline dotted; text-underline-offset:3px; }
  .copyable:active{ opacity:.7; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(12px);
    background:#1b1f2a; color:#fff; padding:10px 18px; border-radius:100px;
    font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,.22); z-index:100;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
    display:flex; align-items:center; gap:7px; white-space:nowrap; max-width:90vw; overflow:hidden;
  }
  .toast span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#d6dae2; border-radius:8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">SMP · Bảng giá &amp; thưởng</p>
      <h1>Tra cứu Giá Thưởng</h1>
    </div>
    <div class="sync" id="syncStatus"><span class="dot loading" id="syncDot"></span><span id="syncText">Đang tải…</span></div>
  </header>

  <div class="controls">
    <div class="field">
      <label for="picker">Chọn nhóm hàng</label>
      <div class="input-with-clear">
        <input id="picker" type="text" placeholder="Gõ hoặc chọn nhóm hàng…" autocomplete="off">
        <button type="button" id="pickerClear" class="clear-btn" aria-label="Xóa nhóm hàng đã chọn" style="display:none">✕</button>
      </div>
      <div class="suggest" id="suggestBox"></div>
    </div>
    <div class="field">
      <label for="keyword">Tìm theo từ khóa (tên SP / loại)</label>
      <input id="keyword" type="text" placeholder="VD: OPPO, Samsung, 256GB…" autocomplete="off">
    </div>
  </div>

  <div class="hint" id="selectHint">Chọn một nhóm hàng ở trên để xem sản phẩm.</div>

  <div id="resultsSection" style="display:none">
    <div class="section-label"><h2>Top 4 thưởng cao nhất trong nhóm</h2></div>
    <div class="top-grid" id="topGrid">
      <div class="top-empty">—</div>
    </div>

    <div class="section-label">
      <h2>Kết quả</h2>
      <span class="count" id="rowCount"></span>
    </div>
    <div class="tablewrap">
      <div class="rowhead">
        <span class="c-name">Tên SP</span>
        <span class="c-num">Giá NY</span>
        <span class="c-num">Giá KM</span>
        <span class="c-num">Thưởng</span>
      </div>
      <div class="scrollbody">
        <div id="tbody"><div class="loading-state">Đang tải dữ liệu từ Google Sheet…</div></div>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"><span id="toastText"></span></div>

<script>
const SHEET_ID = '1DqOGl4e2rLsvSOmJMiKyAzOSFPACjQKhPeASnX_w6wI';
const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

let allRows = [];   // {A,B,C,D,E,F,G}
let filteredRows = [];
let groupList = []; // [{name, count}]
let selectedGroup = '';

const $ = (id) => document.getElementById(id);
const tbody = $('tbody');
const rowCount = $('rowCount');
const picker = $('picker');
const pickerClear = $('pickerClear');
const suggestBox = $('suggestBox');
const keyword = $('keyword');
const topGrid = $('topGrid');
const resultsSection = $('resultsSection');
const selectHint = $('selectHint');

function sortByBonusDesc(rows){
  return [...rows].sort((a, b) => {
    const av = parseVNNumber(a.E), bv = parseVNNumber(b.E);
    const aNaN = isNaN(av), bNaN = isNaN(bv);
    if(aNaN && bNaN) return 0;
    if(aNaN) return 1;
    if(bNaN) return -1;
    return bv - av;
  });
}

function cellVal(row, idx){
  const c = row.c && row.c[idx];
  if(!c) return '';
  if(c.f !== undefined && c.f !== null && c.f !== '') return String(c.f);
  if(c.v !== undefined && c.v !== null) return String(c.v);
  return '';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function parseVNNumber(s){
  if(s === undefined || s === null) return NaN;
  const cleaned = String(s).trim().replace(/\./g, '').replace(/,/g, '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? NaN : n;
}

/* ---------- Copy to clipboard ---------- */
const toastEl = $('toast');
const toastTextEl = $('toastText');
let toastTimer = null;

function showToast(msg){
  toastTextEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function copyToClipboard(text){
  if(!text) return;
  const done = () => showToast(`Đã copy: ${text}`);
  const fail = () => showToast('Không thể copy — trình duyệt chặn quyền truy cập clipboard');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done, fail));
  }else{
    fallbackCopy(text, done, fail);
  }
}

function fallbackCopy(text, done, fail){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    ok ? done() : fail();
  }catch(e){
    fail();
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('.copyable');
  if(!el) return;
  e.stopPropagation();
  const text = el.getAttribute('data-copy') || el.textContent.trim();
  copyToClipboard(text);
});

/* ---------- Data loading ---------- */

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    }else{
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function normalizeRows(rawRows){
  return rawRows
    .map(cols => ({
      A: (cols[0] || '').trim(),
      B: (cols[1] || '').trim(),
      C: (cols[2] || '').trim(),
      D: (cols[3] || '').trim(),
      E: (cols[4] || '').trim(),
      F: (cols[5] || '').trim(),
      G: (cols[6] || '').trim(),
    }))
    .filter(row => row.B && row.B !== 'TÊN SP');
}

function loadViaScriptTag(url, timeoutMs = 12000){
  return new Promise((resolve, reject) => {
    window.google = window.google || {};
    window.google.visualization = window.google.visualization || {};
    window.google.visualization.Query = window.google.visualization.Query || {};
    const prevSetResponse = window.google.visualization.Query.setResponse;
    let settled = false;

    function cleanup(){
      if(script.parentNode) script.parentNode.removeChild(script);
      window.google.visualization.Query.setResponse = prevSetResponse;
    }

    window.google.visualization.Query.setResponse = function(json){
      if(settled) return;
      settled = true;
      resolve(json);
      cleanup();
    };

    const script = document.createElement('script');
    script.src = url;
    script.onerror = () => {
      if(settled) return;
      settled = true;
      reject(new Error('Không tải được script (Sheet chưa public, sai đường dẫn, hoặc mạng chặn docs.google.com)'));
      cleanup();
    };
    document.head.appendChild(script);

    setTimeout(() => {
      if(settled) return;
      settled = true;
      reject(new Error('Hết thời gian chờ phản hồi từ Google Sheets (quá 12s)'));
      cleanup();
    }, timeoutMs);
  });
}

async function tryGviz(){
  const json = await loadViaScriptTag(GVIZ_URL);
  const rows = json.table && json.table.rows ? json.table.rows : [];
  return normalizeRows(rows.map(r => [0,1,2,3,4,5,6].map(i => cellVal(r, i))));
}

async function tryCsv(){
  const res = await fetch(CSV_URL, { cache: 'no-store' });
  const text = await res.text();
  if(!res.ok || text.trim().startsWith('<')){
    throw new Error(`csv HTTP ${res.status} — phản hồi: ${text.slice(0, 200)}`);
  }
  const rows = parseCSV(text);
  return normalizeRows(rows.slice(1));
}

function buildGroupList(){
  const counts = new Map();
  allRows.forEach(r => {
    const g = r.F || '(Không có nhóm)';
    counts.set(g, (counts.get(g) || 0) + 1);
  });
  groupList = Array.from(counts.entries())
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => a.name.localeCompare(b.name, 'vi'));
}

async function loadData(){
  const errors = [];
  for(const [label, fn] of [['gviz', tryGviz], ['csv', tryCsv]]){
    try{
      allRows = await fn();
      buildGroupList();
      setSync('ok', `${allRows.length} sản phẩm · ${new Date().toLocaleTimeString('vi-VN')}`);
      return;
    }catch(err){
      errors.push(`[${label}] ${err.message}`);
    }
  }
  console.error(errors.join('\n'));
  selectHint.textContent = 'Không tải được dữ liệu — kiểm tra kết nối rồi tải lại trang.';
  setSync('err', 'Lỗi tải dữ liệu');
}

function setSync(state, msg){
  const dot = $('syncDot');
  dot.className = 'dot' + (state === 'loading' ? ' loading' : state === 'err' ? ' err' : '');
  $('syncText').textContent = msg;
}

/* ---------- Top 4 bonus ---------- */

function renderTopBonus(){
  const groupRows = selectedGroup ? allRows.filter(r => r.F === selectedGroup) : [];
  const ranked = sortByBonusDesc(groupRows.filter(r => !isNaN(parseVNNumber(r.E)))).slice(0, 4);

  if(ranked.length === 0){
    topGrid.innerHTML = `<div class="top-empty">Chưa có dữ liệu thưởng hợp lệ trong nhóm này</div>`;
    return;
  }

  topGrid.innerHTML = ranked.map((row, i) => `
    <div class="top-card" data-name="${escapeHtml(row.B)}">
      <span class="top-rank ${i === 0 ? 'r1' : ''}">#${i + 1}</span>
      <div class="top-name copyable" data-copy="${escapeHtml(row.B)}" title="Bấm để copy tên sản phẩm">${escapeHtml(row.B)}</div>
      <div class="top-bonus-label">Thưởng</div>
      <div class="top-bonus-val">${escapeHtml(row.E)}</div>
    </div>
  `).join('');

  topGrid.querySelectorAll('.top-card').forEach(card => {
    card.addEventListener('click', () => {
      const row = allRows.find(r => r.B === card.getAttribute('data-name'));
      if(row) showSpotlight(row);
    });
  });
}

/* ---------- Results list ---------- */

function renderTable(rows){
  rowCount.textContent = `${rows.length} kết quả`;
  if(rows.length === 0){
    tbody.innerHTML = `<div class="empty-state">Không tìm thấy sản phẩm nào khớp với <b>${escapeHtml(keyword.value || selectedGroup)}</b></div>`;
    return;
  }
  tbody.innerHTML = rows.map(row => `
    <div class="prow" data-name="${escapeHtml(row.B)}">
      <span class="c-name"><span class="nm copyable" data-copy="${escapeHtml(row.B)}" title="Bấm để copy tên sản phẩm">${escapeHtml(row.B)}</span></span>
      <span class="c-num">${escapeHtml(row.C)}</span>
      <span class="c-num">${escapeHtml(row.D)}</span>
      <span class="c-num bonus">${escapeHtml(row.E)}</span>
    </div>
  `).join('');

  tbody.querySelectorAll('.prow').forEach(el => {
    el.addEventListener('click', () => {
      const row = allRows.find(r => r.B === el.getAttribute('data-name'));
      if(row) showSpotlight(row);
    });
  });
}

function showSpotlight(row){
  $('spGroup').textContent = row.F || '—';
  $('spName').textContent = row.B || '—';
  $('spGiaNY').textContent = row.C || '—';
  $('spGiaKM').textContent = row.D || '—';
  $('spThuong').textContent = row.E || '—';
  $('spLoai').textContent = row.G || '—';
  spotlight.classList.add('show');
  spotlight.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

$('spotlightClose').addEventListener('click', () => {
  spotlight.classList.remove('show');
});

/* ---------- Group dropdown (typeahead over unique column-F values) ---------- */
let activeIdx = -1;

function openSuggest(list){
  if(list.length === 0){
    suggestBox.innerHTML = `<div class="empty">Không có nhóm hàng phù hợp</div>`;
  }else{
    suggestBox.innerHTML = list.map((g, i) => `
      <div class="opt" data-idx="${i}" data-name="${escapeHtml(g.name)}">
        <span class="name">${escapeHtml(g.name)}</span>
        <span class="grp">${g.count} SP</span>
      </div>
    `).join('');
  }
  suggestBox.classList.add('open');
  activeIdx = -1;
}

function closeSuggest(){
  suggestBox.classList.remove('open');
  suggestBox.innerHTML = '';
  activeIdx = -1;
}

function matchingGroups(q){
  if(q === '') return groupList;
  return groupList.filter(g => g.name.toLowerCase().includes(q));
}

picker.addEventListener('input', () => {
  const q = picker.value.trim().toLowerCase();
  openSuggest(matchingGroups(q));
  updateClearVisibility();
  if(q === ''){ selectedGroup = ''; hideResults(); }
});

picker.addEventListener('focus', () => {
  const q = picker.value.trim().toLowerCase();
  openSuggest(matchingGroups(q));
});

picker.addEventListener('keydown', (e) => {
  const opts = Array.from(suggestBox.querySelectorAll('.opt'));
  if(opts.length === 0) return;
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    activeIdx = Math.min(activeIdx + 1, opts.length - 1);
    opts.forEach((o,i) => o.classList.toggle('active', i === activeIdx));
    opts[activeIdx].scrollIntoView({ block:'nearest' });
  }else if(e.key === 'ArrowUp'){
    e.preventDefault();
    activeIdx = Math.max(activeIdx - 1, 0);
    opts.forEach((o,i) => o.classList.toggle('active', i === activeIdx));
    opts[activeIdx].scrollIntoView({ block:'nearest' });
  }else if(e.key === 'Enter'){
    e.preventDefault();
    if(activeIdx >= 0 && opts[activeIdx]){
      selectGroup(opts[activeIdx].getAttribute('data-name'));
    }
  }else if(e.key === 'Escape'){
    closeSuggest();
  }
});

suggestBox.addEventListener('mousedown', (e) => {
  const opt = e.target.closest('.opt');
  if(opt) selectGroup(opt.getAttribute('data-name'));
});

function selectGroup(name){
  selectedGroup = name;
  picker.value = name;
  updateClearVisibility();
  showResults();
  renderTopBonus();
  applyFilters();
  closeSuggest();
}

function updateClearVisibility(){
  pickerClear.style.display = picker.value.trim() !== '' ? 'flex' : 'none';
}

function showResults(){
  resultsSection.style.display = 'block';
  selectHint.style.display = 'none';
}

function hideResults(){
  resultsSection.style.display = 'none';
  selectHint.style.display = 'block';
}

pickerClear.addEventListener('click', () => {
  selectedGroup = '';
  picker.value = '';
  keyword.value = '';
  updateClearVisibility();
  hideResults();
  closeSuggest();
  picker.focus();
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.field')) closeSuggest();
});

/* ---------- Keyword search (columns B and G), scoped to selected group ---------- */
keyword.addEventListener('input', applyFilters);

function applyFilters(){
  if(!selectedGroup) return;
  const kw = keyword.value.trim().toLowerCase();
  let rows = allRows.filter(r => r.F === selectedGroup);
  if(kw){
    rows = rows.filter(r => r.B.toLowerCase().includes(kw) || r.G.toLowerCase().includes(kw));
  }
  filteredRows = sortByBonusDesc(rows);
  renderTable(filteredRows);
}

loadData();
</script>
</body>
</html>
